# Mini App ni GitHub Pages ga chiqaradi.
# Natija: https://nurbektez.github.io/hamyon/ — hech qachon o'zgarmaydigan HTTPS manzil,
# ya'ni cloudflared tunneli endi WEBAPP_URL uchun kerak emas.
name: Deploy Mini App to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true — Pages sozlanmagan bo'lsa, uni o'zi yoqadi
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4
